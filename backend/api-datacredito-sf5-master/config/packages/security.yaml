security:
    providers:
        usuario_provider:
            id: App\Security\UsuarioProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/
            stateless: true
            provider: usuario_provider
            jwt: ~

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        # Generador de Cartas se enruta con su prefijo público intacto
        # (gateway strip_prefix: false), así que sus rutas caen bajo /api.
        # Debe exigir autenticación — al contrario que /api/docs de API Platform,
        # que sí es PUBLIC_ACCESS. Esta regla más específica va antes que ^/api.
        - { path: ^/api/cartera/generador-cartas, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
