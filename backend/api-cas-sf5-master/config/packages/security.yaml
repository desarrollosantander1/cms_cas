security:
    # CAS crea/edita filas de gbl.usuario (mirror Gbl\Usuario) al asociar
    # usuarios nuevos a un centro de servicio, por eso necesita su propio
    # hasher — igual que API users sf4-1, pero apuntando a la clase espejo.
    password_hashers:
        App\Entity\Gbl\Usuario: 'auto'

    providers:
        usuario_provider:
            id: App\Security\UsuarioProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/
            stateless: true
            provider: usuario_provider
            jwt: ~

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\Gbl\Usuario:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
