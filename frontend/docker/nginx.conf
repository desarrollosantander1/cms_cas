server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback: let Vue Router handle unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same relative /api prefix the app already calls (see .env VITE_API_URL),
    # reverse-proxied here to the gateway's internal compose DNS name so the
    # built static bundle doesn't need to know any real host/port.
    location /api/ {
        # No trailing slash / URI part on purpose: the gateway's own
        # routing table (gateway.yaml) matches on the full "/api/..."
        # prefix, so it must reach it unchanged.
        proxy_pass http://gateway-nginx;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
